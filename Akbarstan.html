<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akbarstan • ОБЩЕЖИТИЕ — Заявка на комнату</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
            padding: 32px;
        }

        .badge {
            display: inline-block;
            background-color: #312e81;
            color: #818cf8;
            border: 1px solid #4338ca;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        button {
            width: 100%;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: #4f46e5;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #334155;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            color: #cbd5e1;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
        }

        .card-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .card strong {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
        }

        .card p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">Akbarstan • ОБЩЕЖИТИЕ</div>
    
    <h1>Заявка на комнату</h1>
    
    <p class="subtitle">
        Заполните данные студента и комнаты.<br>
        Система проверит возможность заселения.
    </p>

    <form id="checkForm">
        <div class="form-group">
            <label for="student">ФИО Студента</label>
            <input type="text" id="student" placeholder="Введите имя и фамилию" required>
        </div>

        <div class="form-group">
            <label for="building">Корпус</label>
            <select id="building" required>
                <option value="">Выберите корпус</option>
                <option value="Корпус Alfa">Корпус Alfa</option>
                <option value="Корпус Beta">Корпус Beta</option>
                <option value="Центральный корпус">Центральный корпус</option>
            </select>
        </div>

        <div class="form-group">
            <label for="room">Номер комнаты</label>
            <input type="text" id="room" placeholder="Например: 402" required>
        </div>

        <button type="submit">Проверить заселение</button>
    </form>

    <div class="status" id="statusBox">
        Проверяем данные...
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-icon">👤</div>
            <strong>Студент</strong>
            <p id="resStudent">—</p>
        </div>
        <div class="card">
            <div class="card-icon">🏢</div>
            <strong>Корпус</strong>
            <p id="resBuilding">—</p>
        </div>
        <div class="card">
            <div class="card-icon">🔑</div>
            <strong>Комната</strong>
            <p id="resRoom">—</p>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('checkForm');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const student = document.getElementById('student').value;
        const building = document.getElementById('building').value;
        const room = document.getElementById('room').value;

        statusBox.style.display = 'block';
        statusBox.style.backgroundColor = '#334155';
        statusBox.style.color = '#cbd5e1';
        statusBox.textContent = 'Проверяем данные...';

        setTimeout(() => {
            document.getElementById('resStudent').textContent = student;
            document.getElementById('resBuilding').textContent = building;
            document.getElementById('resRoom').textContent = room;
            
            statusBox.style.backgroundColor = '#064e3b';
            statusBox.style.color = '#6ee7b7';
            statusBox.textContent = 'Заселение одобрено! Добро пожаловать в Akbarstan.';
        }, 800);
    });
</script>

</body>
</html>
